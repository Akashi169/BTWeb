<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div id="carouselExampleRide" class="carousel slide"
			data-bs-ride="true">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="images\images.png" class="d-block w-100" alt="..."
						height="350px">
				</div>
				<div class="carousel-item">
					<img src="images/banner_book.jpg" class="d-block w-100" alt="..."
						height="350px">

				<div class="carousel-item">
