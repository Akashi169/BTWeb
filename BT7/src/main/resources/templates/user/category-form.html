<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base::layout(~{::section})}">
<section>
	<div class="container">
		<h1 class="text-center my-4">Categories List</h1>
		<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		<button type="button" class="btn btn-primary" data-bs-toggle="modal"
			data-bs-target="#categoryModal">Add New Category</button>
		<table class="table">
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Image</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="category: ${categories}">
					<td th:text="${category.id}"></td>
					<td th:text="${category.name}"></td>
					<td>
						<img th:if="${category.imageUrl != null}"
						th:src="@{/images/{img}(img=${category.imageUrl})}"
						alt="Category Image" width="100"> <img
						th:if="${category.imageUrl == null}"
						th:src="@{/images/default.png}" alt="No image" width="100">
					<td>
						<button type="button" class="btn btn-warning"
							data-bs-toggle="modal" data-bs-target="#editCategoryModal"
							th:data-id="${category.id}" th:data-name="${category.name}"
							th:data-imageurl="${category.imageUrl}">Edit</button>


 						<form th:action="@{/user/categories/delete}" method="post"
							style="display: inline;">
							<input type="hidden" th:name="id" th:value="${category.id}" />
							<button type="submit" class="btn btn-danger"
								onclick="return confirm('Bạn có chắc muốn xóa không?');">
								Delete</button>
						</form>   
					</td>
			</tbody>
		</table>
	</div>

	<div class="modal fade" id="categoryModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Add Category</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form th:action="@{/user/categories/add}" method="post"
						th:object="${category}" enctype="multipart/form-data">
						<div class="mb-3">
							<label class="form-label">Category Name</label> <input
								type="text" th:field="*{name}" class="form-control" required />
							<div th:errors="*{name}" class="text-danger"></div>
						</div>
						<div class="mb-3">
							<label class="form-label">Image</label> <input type="file"
								name="imageFile" class="form-control" accept="image/*" />
						</div>
						<button type="submit" class="btn btn-success">Save</button>
					</form>
				</div>
			</div>
		</div>
	</div>


	<div class="modal fade" id="editCategoryModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Edit Category</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form th:action="@{/user/categories/update}" method="post"
						enctype="multipart/form-data">
						<input type="hidden" name="id" id="editCategoryId" />
						<div class="mb-3">
							<label class="form-label">Category Name</label> <input
								type="text" name="name" id="editName" class="form-control"
								required />
						</div>
						<div class="mb-3">
							<label class="form-label">Image</label> <input type="file"
								name="imageFile" class="form-control" accept="image/*" /> <input
								type="hidden" name="existingImageUrl" id="editCategoryImageUrl" />
						</div>
						<button type="submit" class="btn btn-success">Update</button>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var editButtons = document.querySelectorAll('button[data-bs-target="#editCategoryModal"]');
            editButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    var id = this.getAttribute('data-id');
                    var name = this.getAttribute('data-name');
                    var imageUrl = this.getAttribute('data-imageurl');

                    document.getElementById('editCategoryId').value = id;
                    document.getElementById('editName').value = name;
                    document.getElementById('editCategoryImageUrl').value = imageUrl || '';
                });
            });
        });
    </script>
</section>
</html>
